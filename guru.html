<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow">
<title>Ruang Guru Miku</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b53;--mut:#667;--bg:#f6f4ee;--card:#fff;--line:#e3dfd2;--acc:#3d5afe;--ok:#1f9d6b;--mid:#d99a1b;--lo:#d9473b;--gr:#9aa1b2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ar{font-family:Amiri,"Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;font-size:1.25em}
header{background:var(--ink);color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1}
header small{opacity:.8}
nav{display:flex;gap:4px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:#fff}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:16px;margin:0 0 8px}
.card h3{font-size:14px;margin:12px 0 6px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi small{color:var(--mut)}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eee;color:#444}
.chip.ok{background:#d6f3e6;color:#0f6b47}.chip.md{background:#fdebc4;color:#845a00}.chip.lo{background:#fbd9d4;color:#8f2418}.chip.gr{background:#e6e8ee;color:#555}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
tr.cl{cursor:pointer}tr.cl:hover{background:#faf8f1}
.bar{height:9px;background:#ece8da;border-radius:9px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:9px}
.mut{color:var(--mut)}.sm{font-size:13px}
.warn{background:#fff5da;border:1px solid #f0d58a;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.err{background:#fde8e5;border:1px solid #f1b3ab;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.info{background:#e9efff;border:1px solid #c3d1ff;border-radius:10px;padding:10px 12px;margin:0 0 12px}
.flag{padding:6px 10px;border-left:4px solid var(--gr);background:#faf8f1;border-radius:6px;margin:5px 0}
.flag.hi{border-color:var(--lo)}.flag.md{border-color:var(--mid)}.flag.lo{border-color:var(--acc)}
ul.cl2{margin:4px 0 4px 18px;padding:0}ul.cl2 li{margin:3px 0}
.wc{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:6px}
.wc div{border-radius:9px;padding:6px 8px;text-align:center;font-size:12px;border:1px solid var(--line)}
.wc .ar{display:block;font-size:20px;line-height:1.5}
.w0{background:#eceef3}.w1{background:#fde9a8}.w2{background:#c6efd7}.w3{background:#55c58f;color:#06331f}
.star{color:#d99a1b;letter-spacing:1px}
textarea,input[type=text],input[type=search],select{font:inherit;border:1px solid #c9c4b3;border-radius:8px;padding:7px 9px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:90px}
.tier{display:inline-block;padding:2px 12px;border-radius:99px;color:#fff;font-weight:700}
.t-r{background:var(--lo)}.t-p{background:var(--mid)}.t-e{background:var(--ok)}.t-m{background:var(--gr)}
svg{max-width:100%;height:auto}
#printAll{display:none}
.hist td,.hist th{font-size:13px}
.need{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:#fffdf7}
@media print{
 header,nav,.noprint{display:none!important}
 body{background:#fff;font-size:12px}
 main{max-width:none;padding:0}
 .card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}
 body.pa #app{display:none}body.pa #printAll{display:block}
 .pb{break-after:page}
}

/* ---- tampilan baru ---- */
:root{--ink:#14213d;--bg:#f1f4f9;--line:#dde3ee;--acc:#2f5bea;--mut:#5d6679}
body{font-size:15px;line-height:1.55}
header{padding:12px 16px;gap:10px;position:static}
header h1{font-size:17px;letter-spacing:-.01em}
header small{font-size:12px;opacity:.75}
header .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35);padding:6px 11px;font-size:13px}
nav{padding:6px 10px;gap:2px;box-shadow:0 1px 0 var(--line)}
nav button{padding:9px 14px;font-weight:600;transition:background .15s,color .15s}
nav button:hover:not(.on){background:#eef1f8;color:var(--ink)}
main{padding:18px 16px 40px}
.card,.kpi{border-radius:14px;box-shadow:0 1px 2px rgba(20,33,61,.05)}
.card{padding:16px 18px}
.card h2{font-size:17px;margin-bottom:10px}
.kpi{padding:12px 16px}
.kpi b{font-size:28px;letter-spacing:-.02em}
.btn{padding:9px 14px;border-radius:10px;min-height:40px;transition:background .15s,transform .05s}
.btn:hover:not(:disabled){background:#eef1f8}.btn.pri:hover:not(:disabled){background:#22335c}
.btn:active{transform:scale(.98)}
th{text-transform:none;letter-spacing:0;font-size:12.5px}
tr.cl:hover{background:#f4f7fd}
input[type=text],input[type=search],input[type=password],select,textarea{border-radius:10px;padding:10px 12px;border-color:#c5cddd}
:focus-visible{outline:3px solid #9db4ff;outline-offset:1px}
details.card>summary{cursor:pointer;font-weight:600;list-style:revert}
details.card[open]>summary{margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);max-width:min(92vw,520px);background:#14213d;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
 main{padding:12px 10px 90px}
 .card{padding:14px}
 .g2{grid-template-columns:1fr}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(20,33,61,.08);overflow:visible}
 nav button{flex:1;padding:9px 2px;font-size:11.5px;white-space:normal;line-height:1.2;text-align:center}
 table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
 #toast{bottom:90px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- putaran 2: ikon, kontras, mode gelap, state ---- */
::selection{background:#bcd0ff;color:#14213d}
input,textarea{caret-color:var(--acc)}
*{scrollbar-width:thin;scrollbar-color:#b3bdd3 transparent}
td,th,.kpi b,.chip{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button{display:inline-flex;align-items:center;gap:8px}
header .btn{display:inline-flex;align-items:center;gap:7px}
header .btn svg.i{width:17px;height:17px}
header .btn.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.flag{border-left:0;position:relative;padding-left:28px}
.flag::before{content:"";position:absolute;left:11px;top:1em;width:8px;height:8px;border-radius:50%;background:var(--gr)}
.flag.hi::before{background:var(--lo)}.flag.md::before{background:var(--mid)}.flag.lo::before{background:var(--acc)}
@media(max-width:700px){
 nav button{flex-direction:column;gap:3px}
 nav button svg.i{width:22px;height:22px}
 nav button.on{background:#e6ecff;color:var(--ink)}
 .btn{min-height:44px}
 tr.cl td{padding-top:11px;padding-bottom:11px}
}
@media screen and (prefers-color-scheme:dark){
 :root{color-scheme:dark;--ink:#e8edf8;--mut:#9aa6bd;--bg:#0f1524;--card:#18203a;--line:#2a3558;--acc:#8fa8ff}
 *{scrollbar-color:#3a4772 transparent}
 header{background:#0a1020}
 nav{background:#141c33}
 nav button:hover:not(.on){background:#1d2745}
 nav button.on{background:#e8edf8;color:#14213d}
 .btn{background:#1d2745;color:var(--ink);border-color:#3a4772}
 .btn.pri{background:#8fa8ff;color:#0b1226;border-color:#8fa8ff}
 .btn:hover:not(:disabled){background:#26335c}.btn.pri:hover:not(:disabled){background:#aabcff}
 header .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
 .kpi{background:var(--card)}
 input[type=text],input[type=search],input[type=password],select,textarea{background:#101830;color:var(--ink);border-color:#34406a}
 .warn{background:#3a3016;border-color:#6a5720}.err{background:#3d1d1d;border-color:#7a3333}.info{background:#16254a;border-color:#2f4585}
 .flag,.need{background:#1d2745;border-color:#2a3558}
 tr.cl:hover{background:#1f2b4d}.bar{background:#27325a}
 .wc div{color:#14213d}
 .chip{background:#2a3558;color:#d5dcf0}.chip.ok{background:#d6f3e6;color:#0f6b47}.chip.md{background:#fdebc4;color:#845a00}.chip.lo{background:#fbd9d4;color:#8f2418}
 ::selection{background:#3d5199;color:#fff}
}
@media(prefers-reduced-motion:reduce){header .btn.spin svg{animation:none}}

/* ---- hapus data ---- */
.btn.danger{color:#b3261e;border-color:#e3a39d;background:#fff}
.btn.danger:hover:not(:disabled){background:#fde8e5}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);cursor:pointer}
td[data-a=sel],th[data-a=selAll]{width:44px;cursor:pointer}
@media screen and (prefers-color-scheme:dark){.btn.danger{color:#ff9d93;border-color:#7a3333;background:#2a1a1f}.btn.danger:hover:not(:disabled){background:#3d1d1d}}
#mdl{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}#mdl .card{max-width:460px;width:100%;max-height:90vh;overflow:auto;margin:0}#mdl label{display:block;margin-top:8px}#mdl input,#mdl textarea{width:100%;box-sizing:border-box}.tg{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:2px;font-size:13px}.tg b{cursor:pointer;color:var(--lo)}@media print{#mdl{display:none}}</style></head><body>

<nav id="nav"></nav>
